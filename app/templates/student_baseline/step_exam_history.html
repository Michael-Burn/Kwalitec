{% extends "student_baseline/base.html" %}

{% block form_content %}
<form id="wizard-form" method="post" novalidate>
    {{ form.hidden_tag() }}
    <div class="wizard-field-group">
        <div class="wizard-option-list">
            {% for subfield in form.exam_history %}
            {% if subfield.type != 'CSRFTokenField' %}
            <label class="wizard-option-row" for="{{ subfield.id }}">
                {{ subfield(class="wizard-option-input") }}
                <div class="wizard-option-row-body">
                    <div class="wizard-option-row-title">{{ subfield.label.text }}</div>
                </div>
            </label>
            {% endif %}
            {% endfor %}
        </div>
    </div>
    <div class="wizard-field-group" id="baseline-highest-mark" data-baseline-highest-mark hidden>
        <label class="form-label" for="highest_mark">{{ form.highest_mark.label.text }}</label>
        {{ form.highest_mark(class="form-control", placeholder="Optional") }}
    </div>
</form>
<script>
(function () {
  var form = document.getElementById("wizard-form");
  if (!form) return;
  var markField = document.getElementById("baseline-highest-mark");
  var attemptedValue = "previously_attempted";
  function sync() {
    var selected = form.querySelector('input[name="exam_history"]:checked');
    var showMark = selected && selected.value === attemptedValue;
    if (markField) {
      markField.hidden = !showMark;
      if (!showMark) {
        var input = markField.querySelector('input[name="highest_mark"]');
        if (input) input.value = "";
      }
    }
  }
  form.querySelectorAll('input[name="exam_history"]').forEach(function (input) {
    input.addEventListener("change", sync);
  });
  sync();
})();
</script>
{% endblock %}
